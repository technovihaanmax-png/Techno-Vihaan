<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Techno Vihaan • YouTube</title><style>*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 20%,#334a70,#0a0c12 48%,#030305)}.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:-1}.wrap{width:min(1180px,100%);margin:auto;padding:22px}.glass{background:rgba(18,18,22,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.4)}a{color:#fff;text-decoration:none}.back{display:inline-block;margin:5px 0 18px}.head{padding:38px}.kicker{font-size:12px;letter-spacing:.25em;color:#bbb;text-transform:uppercase}.head h1{font-size:clamp(38px,7vw,70px);margin:12px 0;letter-spacing:-.05em}.head p{color:#bbb;line-height:1.6;max-width:700px}.btn{display:inline-block;margin-top:15px;padding:12px 18px;border-radius:14px;background:#fff;color:#111}.section{margin-top:18px;padding:30px}.channel{margin-top:18px}.channel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.channel-head h2{margin:0;font-size:25px}.channel-head p{margin:7px 0 0;color:#999;font-size:13px}.smallbtn{padding:9px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.cards.single{grid-template-columns:minmax(0,1fr);max-width:620px}.cards.shorts{grid-template-columns:minmax(0,360px)}.subhead{margin:24px 0 0;font-size:16px;color:#ddd}.short-link{margin-top:14px}.short-link a{display:inline-block}.video{overflow:hidden;display:block;transition:.25s transform,.25s background}.video:hover{transform:translateY(-4px);background:rgba(35,35,42,.72)}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#101116}.info{padding:15px}.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#aaa}.video h3{font-size:15px;line-height:1.35;margin:7px 0 0}.status{color:#aaa;font-size:12px;margin-top:10px}.loading{color:#aaa;padding:20px 0}.error{color:#aaa;padding:18px 0;line-height:1.5}.footer{text-align:center;color:#888;font-size:12px;padding:25px}.footer a{color:inherit;text-decoration:none;transition:.2s}.footer a:hover{color:#fff}.note{color:#aaa;line-height:1.6;font-size:13px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.cards{grid-template-columns:1fr}.head{padding:28px}.section{padding:22px}.head h1{font-size:44px}}</style></head><body><div class="bg"></div><div class="veil"></div><main class="wrap"><a class="back" href="index.html">← Back</a><section class="glass head"><div class="kicker">YouTube</div><h1>TECHNO VIHAAN</h1><p>Latest content from Techno Vihaan and his two secondary channels. The feed refreshes automatically.</p><a class="btn" href="https://youtube.com/@technovihaan" target="_blank" rel="noopener">Open Main Channel ↗</a></section><div id="channels"></div><div class="footer"><a href="https://youtube.com/@techno.vihaanfans?si=r62EThE03PfzH-dt" target="_blank" rel="noopener">Techno Vihaan Fans</a></div></main><script>
const channels=[
 {name:'TECHNO VIHAAN',id:'UCCxg6r5_5Hh69qxhdsgC14A',url:'https://youtube.com/@technovihaan'},
 {name:'VIHAAN GAMING',id:'UCw8OcCeozU2dcdizYMQfUkw',url:'https://www.youtube.com/channel/UCw8OcCeozU2dcdizYMQfUkw'},
 {name:'VIHAAN IS LIVE',handle:'@vihaanislive',url:'https://youtube.com/@vihaanislive'}
];
const rssProxy='https://api.rss2json.com/v1/api.json?rss_url=';
const htmlProxy='https://api.allorigins.win/raw?url=';
function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function videoId(v){const m=String(v.link||v.guid||'').match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}
function card(v,label){const id=videoId(v);const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;return `<a class="glass video" href="${esc(v.link)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(thumb)}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg'"><div class="info"><div class="tag">${esc(label)}</div><h3>${esc(v.title)}</h3><div class="status">${v.pubDate?esc(new Date(v.pubDate).toLocaleDateString()):''}</div></div></a>`}
async function resolveHandle(handle){const u='https://www.youtube.com/'+handle;const r=await fetch(htmlProxy+encodeURIComponent(u),{cache:'no-store'});const t=await r.text();const m=t.match(/\"channelId\":\"(UC[A-Za-z0-9_-]+)\"/)||t.match(/channelId\"\s*:\s*\"(UC[A-Za-z0-9_-]+)\"/);if(!m)throw new Error('Channel ID not found');return m[1]}
async function getItems(id){const rss=`https://www.youtube.com/feeds/videos.xml?channel_id=${id}`;const r=await fetch(rssProxy+encodeURIComponent(rss),{cache:'no-store'});const d=await r.json();if(!d.items?.length)throw new Error('No feed');return d.items}
function renderSection(box,items,c){const uploads=items.slice(0,8);const shorts=items.filter(v=>/\bshorts?\b|#shorts/i.test(v.title)||/\/shorts\//i.test(v.link)).slice(0,4);const latestVideo=uploads.find(v=>!shorts.includes(v))||uploads[0];const latestShort=shorts[0];let html='';if(latestVideo)html+=`<h3 class="subhead">Latest Video</h3><div class="cards single">${card(latestVideo,'Latest video')}</div>`;if(latestShort)html+=`<h3 class="subhead">Latest Short</h3><div class="cards shorts">${card(latestShort,'Latest Short')}</div>`;html+=`<h3 class="subhead">Recent uploads</h3><div class="cards">${uploads.map(v=>card(v,shorts.includes(v)?'Short':'Video')).join('')}</div>`;if(!latestShort)html+=`<div class="short-link"><a class="smallbtn" href="${c.url}/shorts" target="_blank" rel="noopener">Open latest Shorts ↗</a></div>`;box.insertAdjacentHTML('beforeend',html)}
async function loadChannel(c){const box=document.createElement('section');box.className='glass section channel';box.innerHTML=`<div class="channel-head"><div><h2>${c.name}</h2><p>Latest videos and Shorts — updated automatically</p></div><a class="smallbtn" href="${c.url}" target="_blank" rel="noopener">View Channel ↗</a></div><div class="loading">Loading latest content…</div>`;document.getElementById('channels').appendChild(box);const load=box.querySelector('.loading');try{const id=c.id||await resolveHandle(c.handle);const items=await getItems(id);renderSection(box,items,c);load.remove()}catch(e){load.outerHTML=`<div class="error">The automatic feed is temporarily unavailable. <a href="${c.url}" target="_blank" rel="noopener"><u>Open ${esc(c.name)}</u></a> for the newest videos and Shorts.</div>`}}
channels.forEach(loadChannel);
setInterval(()=>location.reload(),300000);
</script></body></html>
